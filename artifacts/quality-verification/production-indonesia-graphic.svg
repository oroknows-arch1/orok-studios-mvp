<text fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800"><tspan x="72" y="214">Indonesia: MSCI consults on</tspan><tspan x="72" y="284">reclassification</tspan></text>
<text fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="500"><tspan x="72" y="380">MSCI is consulting on moving Indonesia from</tspan><tspan x="72" y="428">Emerging Market to Standalone, with a decision</tspan><tspan x="72" y="476">targeted by end-June 2027. OJK plans disclosure</tspan><tspan x="72" y="524">and free-float reforms. Reuters reported an 11.6%</tspan><tspan x="72" y="572">index fall and cited bank estimates of US$3–6bn in</tspan><tspan x="72" y="620">potential passive outflows. No reclassification</tspan><tspan x="72" y="668">decision has been made.</tspan></text>
<text fill="#aebbd0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600"><tspan x="72" y="758">Sources: MSCI · 2026-10-15 | Otoritas Jasa Keuangan ·</tspan><tspan x="72" y="788">2026-10-16 | Reuters · 2026-10-16</tspan></text>
<text x="72" y="950" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">emradar.net</text>
