name: EMRADAR V3 isolated paid API tests
on:
  push:
    paths:
      - 'src/emradar-v3-*.cjs'
      - 'test/emradar-v3-*.test.cjs'
      - '.github/workflows/emradar-v3-isolated.yml'
  pull_request:
    paths:
      - 'src/emradar-v3-*.cjs'
      - 'test/emradar-v3-*.test.cjs'
      - '.github/workflows/emradar-v3-isolated.yml'
  workflow_dispatch:
jobs:
  v3-isolated:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: v3_test
          POSTGRES_PASSWORD: v3_test_only
          POSTGRES_DB: v3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U v3_test -d v3_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      V3_TEST_DATABASE_URL: postgresql://v3_test:v3_test_only@localhost:5432/v3_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test --test-concurrency=1 test/emradar-v3-*.test.cjs
