name: EMRADAR V3 isolated paid API tests
on:
  push:
    paths:
      - 'src/emradar-v3-*.cjs'
      - 'server.js'
      - 'package.json'
      - 'AGENTS.md'
      - 'docs/development-objective.json'
      - 'scripts/verify-development-harness.cjs'
      - 'test/development-harness.test.cjs'
      - 'test/v3-source-integration.test.cjs'
      - 'docs/v3-source-integration.json'
      - 'scripts/verify-v3-source-integration.cjs'
      - '.gitmodules'
      - 'vendor/emradar-v3-authoritative'
      - 'vendor/emradar-v3/**'
      - 'test/emradar-v3-*.test.cjs'
      - '.github/workflows/emradar-v3-isolated.yml'
  pull_request:
    paths:
      - 'src/emradar-v3-*.cjs'
      - 'AGENTS.md'
      - 'docs/development-objective.json'
      - 'scripts/verify-development-harness.cjs'
      - 'test/development-harness.test.cjs'
      - 'test/v3-source-integration.test.cjs'
      - 'docs/v3-source-integration.json'
      - 'scripts/verify-v3-source-integration.cjs'
      - '.gitmodules'
      - 'vendor/emradar-v3-authoritative'
      - 'test/emradar-v3-*.test.cjs'
      - '.github/workflows/emradar-v3-isolated.yml'
  workflow_dispatch:
jobs:

  discovery-focused:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The production harness below still requires the private authoritative
      # V3 submodule; these isolated discovery regressions do not.
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test test/emradar-v3-autonomous-discovery.test.cjs
  v3-isolated:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: v3_test
          POSTGRES_PASSWORD: v3_test_only
          POSTGRES_DB: v3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U v3_test -d v3_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      V3_TEST_DATABASE_URL: postgresql://v3_test:v3_test_only@localhost:5432/v3_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run harness:verify
      - run: npm run harness:v3
      - run: node --test test/development-harness.test.cjs
      - run: node test/setup-v3-postgres.cjs
      - run: node --test test/emradar-v3-*.test.cjs
